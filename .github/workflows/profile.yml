name: profile

# Rebuilds the live cards (languages, contributions, streak, grid) every day.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Build animated SVGs
        env:
          # Optional: add a classic PAT (read:user) as secret PROFILE_TOKEN to
          # count contributions from both accounts precisely. Without it the
          # public contribution pages are used — still accurate for public work.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_USERS: MoTechSys,moain2026
        run: |
          python scripts/build_static.py
          python scripts/build_live.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh live profile cards"
          git push
